name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: bash scripts/package.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/decky-crt-filter.zip out/install.sh \
            --target "$GITHUB_SHA" \
            --title "CRT Filter $tag" \
            --latest \
            --notes "Built from ${GITHUB_SHA}.

          Install on a machine running Decky Loader:

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash
          \`\`\`

          Or download both files into one folder and run \`bash install.sh\`."
